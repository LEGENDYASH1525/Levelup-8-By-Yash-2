name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Organize Project Folders
        run: |
          mkdir -p src/components src/data src/utils

          # Move utils
          mv audio.ts src/utils/ 2>/dev/null || true

          # Move data
          mv curriculumData.ts leaderboardData.ts src/data/ 2>/dev/null || true

          # Move all components
          mv AiMentorModal.tsx BadgesView.tsx DailyQuizModal.tsx \
             LeaderboardView.tsx LessonCard.tsx Navbar.tsx \
             OnboardingModal.tsx ProfileModal.tsx StudentAvatar.tsx \
             ThreeStepLessonModal.tsx src/components/ 2>/dev/null || true

          # Move app entry files
          mv App.tsx types.ts main.tsx index.css src/ 2>/dev/null || true

          # Ensure index.html references the bundled entry
          sed -i 's|src="./main.tsx"|src="/src/main.tsx"|g' index.html || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application (Vite Only)
        run: npx vite build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap init "LevelUp 8" "com.levelup8.app" --web-dir "dist"
            npx cap add android
          fi
          npx cap sync android

          # Fix duplicate Kotlin stdlib error in gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.jetifier.ignorelist=kotlin-stdlib" >> android/gradle.properties

          # Force single unified kotlin-stdlib across all submodules
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  }
              }
          }
          EOF

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Assemble Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LevelUp-8-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
